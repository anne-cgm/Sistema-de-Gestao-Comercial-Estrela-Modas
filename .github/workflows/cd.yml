
name: CD - Build and Publish Docker Image

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ETAPA 1: Construir e publicar a imagem
  build-and-publish:
    name: Build and Publish Image

    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/anne-cgm/sistema-de-gestao-comercial-estrela-modas
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ETAPA 2: Fazer o deploy em homologação
  deploy-homologacao:

    name: Deploy em Homologação

    needs: build-and-publish

    if: >-
      needs.build-and-publish.result == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: [self-hosted, windows, x64]

    timeout-minutes: 15

    steps:

      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Identificar imagem publicada
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $image = "ghcr.io/anne-cgm/sistema-de-gestao-comercial-estrela-modas:sha-$env:IMAGE_SHA"

          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "DOCKER_IMAGE=$image`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar variáveis de ambiente
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:SECRET_KEY)) {
            throw "SECRET_KEY não configurada."
          }

          if ([string]::IsNullOrWhiteSpace($env:DATABASE_URL)) {
            throw "DATABASE_URL não configurada."
          }

          $content = @"
          SECRET_KEY=$env:SECRET_KEY
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_URL=$env:DATABASE_URL
          PORT=8000
          "@

          $envPath = Join-Path $env:GITHUB_WORKSPACE "backend/.env"

          [System.IO.File]::WriteAllText(
            $envPath,
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Baixar imagem publicada
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker compose pull web

      - name: Atualizar aplicação
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker compose up -d --no-build --remove-orphans

      - name: Verificar aplicação
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker compose ps

          docker compose exec -T web python manage.py check

      - name: Registrar imagem utilizada
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          Write-Host "Imagem utilizada: $env:DOCKER_IMAGE"


name: CD - Build and Publish Docker Image

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:

  # ETAPA 1: Construir e publicar a imagem
  build-and-publish:
    name: Build and Publish Image

    outputs:
      version: ${{ steps.version.outputs.version }}

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Calcular próxima versão
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.workflow_run.head_sha;

            const tags = await github.paginate(
              github.rest.repos.listTags,
              { owner, repo, per_page: 100 }
            );

            const versions = tags
              .map(tag => {
                const match = tag.name.match(/^v?(\d+)\.(\d+)\.(\d+)$/);

                if (!match) return null;

                return {
                  name: tag.name,
                  sha: tag.commit.sha,
                  major: Number(match[1]),
                  minor: Number(match[2]),
                  patch: Number(match[3])
                };
              })
              .filter(Boolean);

            const existing = versions.find(tag => tag.sha === sha);

            let version;

            if (existing) {
              version = `${existing.major}.${existing.minor}.${existing.patch}`;
              core.info(`Commit já possui versão: ${version}`);
            } else if (versions.length === 0) {
              version = "0.1.0";
            } else {
              versions.sort((a, b) =>
                b.major - a.major ||
                b.minor - a.minor ||
                b.patch - a.patch
              );

              const latest = versions[0];

              version = `${latest.major}.${latest.minor}.${latest.patch + 1}`;
            }

            core.setOutput("version", version);
            core.setOutput("tag_name", `v${version}`);

            core.info(`Versão calculada: ${version}`);

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/anne-cgm/sistema-de-gestao-comercial-estrela-modas
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Registrar versão no Git
        uses: actions/github-script@v7
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag_name }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const ref = `refs/tags/${process.env.VERSION_TAG}`;

            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: process.env.COMMIT_SHA
              });

              core.info(`Tag ${ref} criada com sucesso.`);
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }

              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref
              });

              if (existing.data.object.sha !== process.env.COMMIT_SHA) {
                throw new Error(
                  `A tag ${ref} já existe em outro commit.`
                );
              }

              core.info(`Tag ${ref} já existe neste commit.`);
            }

  # ETAPA 2: Fazer o deploy em homologação
  deploy-homologacao:

    name: Deploy em Homologação

    needs: build-and-publish

    if: >-
      needs.build-and-publish.result == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: [self-hosted, windows, x64]

    timeout-minutes: 15

    steps:

      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Identificar imagem publicada
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          IMAGE_VERSION: ${{ needs.build-and-publish.outputs.version }}
        run: |
          $image = "ghcr.io/anne-cgm/sistema-de-gestao-comercial-estrela-modas:$env:IMAGE_VERSION"

          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "DOCKER_IMAGE=$image`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar variáveis de ambiente
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:SECRET_KEY)) {
            throw "SECRET_KEY não configurada."
          }

          if ([string]::IsNullOrWhiteSpace($env:DATABASE_URL)) {
            throw "DATABASE_URL não configurada."
          }

          $content = @"
          SECRET_KEY=$env:SECRET_KEY
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_URL=$env:DATABASE_URL
          PORT=8000
          "@

          $envPath = Join-Path $env:GITHUB_WORKSPACE "backend/.env"

          [System.IO.File]::WriteAllText(
            $envPath,
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Baixar imagem publicada
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker compose pull web

      - name: Atualizar aplicação
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker compose up -d --no-build --remove-orphans

      - name: Verificar aplicação
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker compose ps

          docker compose exec -T web python manage.py check

      - name: Registrar imagem utilizada
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          Write-Host "Imagem utilizada: $env:DOCKER_IMAGE"

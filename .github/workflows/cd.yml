
name: CD - Build and Publish Docker Image

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and Publish Image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          # O nome do repositório Git contém maiúsculas, mas nomes de imagens
          # no GHCR devem estar em letras minúsculas.
          images: ghcr.io/anne-cgm/sistema-de-gestao-comercial-estrela-modas
          tags: |
            type=raw,value=latest
            type=sha

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

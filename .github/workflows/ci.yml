
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # Configura o Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Instala exatamente as dependências registradas no package-lock.json da raiz
      - name: Instalar dependências
        run: npm ci

      # Executa os testes do projeto (inclui tests/script.test.js)
      - name: Executar testes
        run: npm test

      # Verifica se os arquivos obrigatórios estão presentes
      - name: Executar build
        run: npm run build

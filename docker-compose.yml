
name: estrela-modas

services:
  web:
    image: ${DOCKER_IMAGE:-ghcr.io/anne-cgm/sistema-de-gestao-comercial-estrela-modas:latest}

    env_file:
      - ./backend/.env

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    ports:
      - "8000:8000"

    command: python manage.py runserver 0.0.0.0:8000

    restart: unless-stopped

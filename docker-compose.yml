
name: estrela-modas

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-estrela-modas:0.1.1}

    env_file:
      - ./backend/.env

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    ports:
      - "8000:8000"

    # Desenvolvimento local:
    # Remova o comentário abaixo para sincronizar os arquivos
    # do computador com o container automaticamente.
    # volumes:
    #   - .:/app

    command: python manage.py runserver 0.0.0.0:8000

    restart: unless-stopped

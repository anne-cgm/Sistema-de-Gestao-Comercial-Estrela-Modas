<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar senha | Estrela Modas</title>
    <style>
      :root { color-scheme: light; font-family: Inter, Arial, sans-serif; color: #35292a; background: #faf7f2; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 36px; border: 1px solid #e8dece; border-top: 3px solid #d6b16d; border-radius: 16px; background: #fffdfa; box-shadow: 0 16px 60px rgb(88 13 24 / 7%); }
      .brand { margin: 0 0 8px; color: #580d18; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      h1 { margin: 0 0 12px; color: #35292a; font: 600 36px Georgia, serif; }
      p { font-size: 14px; line-height: 1.65; }
      label { display: block; margin: 24px 0 16px; font-size: 13px; font-weight: 600; }
      input { display: block; width: 100%; margin-top: 8px; padding: 13px 14px; border: 1px solid #ded5c9; border-radius: 9px; font: inherit; }
      button { width: 100%; padding: 13px; border: 0; border-radius: 9px; background: #580d18; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      .message { margin: 18px 0 0; padding: 12px 14px; border-left: 3px solid #d6b16d; border-radius: 6px; background: #f6efe5; font-weight: 600; }
      .message.error { border-color: #a52a3a; }
      .back { display: inline-block; margin-top: 22px; color: #580d18; font-size: 13px; }
      @media (max-width: 480px) { main { padding: 28px 22px; } }
          a, a:hover, a:focus, a:active { text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">ESTRELA MODAS</p>
      <h1>Recuperar senha</h1>
      <p>Informe o e-mail cadastrado. A ação disponível depende das permissões do perfil.</p>

      <form method="post" action="{% url 'recuperar_senha' %}">
        {% csrf_token %}
        <label for="email">E-mail do usuário
          <input id="email" type="email" name="email" autocomplete="email" required autofocus />
        </label>
        <button type="submit">Continuar</button>
      </form>

      {% if mensagem %}
        <p class="message {{ tipo_mensagem|default:'info' }}" role="status">{{ mensagem }}</p>
      {% endif %}

      <a class="back" href="{% url 'login' %}">Voltar ao login</a>
    </main>
  </body>
</html>
